<!DOCTYPE html>
<html lang="en" class="scroll-pt-24">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard | ApexVanguard Capital</title>
  <meta name="description" content="Track your loan applications, upload documents and apply for new financing.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-slate-900 flex items-center justify-center text-white font-bold text-sm">AV</div>
        <span class="font-bold text-slate-900">ApexVanguard</span>
      </a>
      <div class="flex items-center gap-4 text-sm">
        <span id="user-name" class="hidden sm:inline text-slate-700 font-medium"></span>
        <a href="login.html" class="text-slate-600 hover:text-slate-900">Sign out</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-8">

    <!-- Welcome -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Hi, <span id="user-first-name">there</span></h1>
        <p class="text-sm text-slate-500" id="user-company"></p>
      </div>
      <a href="#apply" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg text-center transition-colors">
        + New application
      </a>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="text-sm text-slate-500">Applications</div>
        <div id="stat-apps" class="text-2xl font-bold mt-1">0</div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="text-sm text-slate-500">Total requested</div>
        <div id="stat-total" class="text-2xl font-bold mt-1 font-mono-numbers">₹0</div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="text-sm text-slate-500">Documents uploaded</div>
        <div id="stat-docs" class="text-2xl font-bold mt-1">0</div>
      </div>
    </div>

    <!-- Applications -->
    <section>
      <h2 class="text-lg font-bold text-slate-900 mb-3">My applications</h2>
      <div id="applications-list" class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100"></div>
    </section>

    <!-- New Application -->
    <section id="apply" class="bg-white rounded-xl border border-slate-200 p-6 scroll-mt-6">
      <h2 class="text-lg font-bold text-slate-900">New application</h2>
      <p class="text-sm text-slate-500 mb-5">Takes about 2 minutes. No fees.</p>

      <form id="new-application-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label for="app-equipment-name" class="block text-sm font-medium text-slate-700 mb-1">What do you need financed?</label>
          <input type="text" id="app-equipment-name" required placeholder="e.g. CAT 320 Excavator" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label for="app-amount" class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
          <input type="number" id="app-amount" required value="150000" min="10000" step="1000" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label for="app-term" class="block text-sm font-medium text-slate-700 mb-1">Term</label>
          <select id="app-term" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm bg-white">
            <option value="36">36 months</option>
            <option value="48">48 months</option>
            <option value="60" selected>60 months</option>
            <option value="72">72 months</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <button type="submit" class="w-full sm:w-auto px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg transition-colors">
            Submit application
          </button>
        </div>
      </form>
    </section>

    <!-- Documents -->
    <section id="documents" class="scroll-mt-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold text-slate-900">Documents</h2>
        <label class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg cursor-pointer transition-colors">
          Upload file
          <input type="file" id="doc-file-input" class="hidden" multiple accept=".pdf,.docx,.xlsx,.png,.jpg">
        </label>
      </div>
      <div id="documents-list" class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100"></div>
    </section>

  </main>

  <footer class="py-6 text-center text-xs text-slate-500">
    Need help? Call <strong class="text-slate-700">(800) 555-8920</strong>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const user = DataStore.getUser();
    let applications = DataStore.getApplications();
    let documents = DataStore.getDocuments();

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    document.getElementById('user-name').textContent = user.name;
    document.getElementById('user-first-name').textContent = user.name.split(' ')[0];
    document.getElementById('user-company').textContent = user.company;

    function statusClass(stage) {
      return stage === 'Funded' || stage === 'Approved'
        ? 'bg-emerald-50 text-emerald-700'
        : 'bg-amber-50 text-amber-700';
    }

    function renderStats() {
      document.getElementById('stat-apps').textContent = applications.length;
      document.getElementById('stat-total').textContent = formatCurrency(applications.reduce((sum, a) => sum + a.amount, 0));
      document.getElementById('stat-docs').textContent = documents.length;
    }

    function renderApplications() {
      const list = document.getElementById('applications-list');
      if (applications.length === 0) {
        list.innerHTML = '<p class="p-5 text-sm text-slate-500">No applications yet.</p>';
        return;
      }
      list.innerHTML = applications.map(app => `
        <div class="p-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <div class="font-semibold text-slate-900">${esc(app.title)}</div>
              <div class="text-xs text-slate-500 mt-0.5">${esc(app.id)} &bull; ${app.termMonths} months &bull; Submitted ${esc(app.submissionDate)}</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold font-mono-numbers">${formatCurrency(app.amount)}</span>
              <span class="text-xs font-medium px-2.5 py-1 rounded-full ${statusClass(app.stage)}">${esc(app.stage)}</span>
            </div>
          </div>
          <div class="mt-3 h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full" style="width:${app.progressPercent}%"></div>
          </div>
        </div>
      `).join('');
    }

    function renderDocuments() {
      const list = document.getElementById('documents-list');
      if (documents.length === 0) {
        list.innerHTML = '<p class="p-5 text-sm text-slate-500">No documents uploaded yet.</p>';
        return;
      }
      list.innerHTML = documents.map(doc => `
        <div class="p-4 flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="text-sm font-medium text-slate-900 truncate">${esc(doc.name)}</div>
            <div class="text-xs text-slate-500">${esc(doc.uploadedAt)} &bull; ${esc(doc.fileSize)}</div>
          </div>
          <span class="shrink-0 text-xs font-medium px-2.5 py-1 rounded-full ${doc.status === 'Verified' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${esc(doc.status)}</span>
        </div>
      `).join('');
    }

    // New application
    document.getElementById('new-application-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('app-amount').value) || 150000;
      const termMonths = parseInt(document.getElementById('app-term').value, 10) || 60;
      const newApp = {
        id: `APP-${Math.floor(8100 + Math.random() * 800)}`,
        title: document.getElementById('app-equipment-name').value.trim() || 'Equipment financing',
        category: 'Equipment Financing',
        amount,
        termMonths,
        submissionDate: 'Just now',
        stage: 'Submitted',
        progressPercent: 25
      };
      applications = DataStore.addApplication(newApp);
      renderApplications();
      renderStats();
      e.target.reset();
      showToast(`Application ${newApp.id} submitted. We'll be in touch soon.`, 'success');
      document.getElementById('applications-list').scrollIntoView({ behavior: 'smooth' });
    });

    // Document upload
    document.getElementById('doc-file-input').addEventListener('change', (e) => {
      Array.from(e.target.files).forEach(file => {
        documents = DataStore.addDocument({
          id: `DOC-${Date.now()}`,
          name: file.name,
          uploadedAt: 'Just now',
          fileSize: file.size > 1048576 ? `${(file.size / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(file.size / 1024))} KB`,
          status: 'Under Review'
        });
      });
      renderDocuments();
      renderStats();
      if (e.target.files.length) showToast('File uploaded.', 'success');
      e.target.value = '';
    });

    // Links from other pages: ?tab=new-app, ?tab=vault, ?from_quote=true
    const params = new URLSearchParams(window.location.search);
    if (params.get('from_quote') === 'true') {
      try {
        const q = JSON.parse(localStorage.getItem('apexvanguard_saved_quote'));
        if (q) {
          document.getElementById('app-amount').value = q.amount;
          const termSelect = document.getElementById('app-term');
          if (termSelect.querySelector(`option[value="${q.term}"]`)) termSelect.value = q.term;
        }
      } catch (err) {}
    }
    const tab = params.get('tab');
    if (tab === 'new-app' || params.get('from_quote') || params.get('prefilled')) {
      document.getElementById('apply').scrollIntoView();
    } else if (tab === 'vault') {
      document.getElementById('documents').scrollIntoView();
    }

    renderStats();
    renderApplications();
    renderDocuments();
  </script>
</body>
</html>
