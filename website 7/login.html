<!DOCTYPE html>
<html lang="en" class="scroll-pt-24">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login | ApexVanguard Capital</title>
  <meta name="description" content="Client login for ApexVanguard Capital. Track your loan applications and documents.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <header class="bg-white/95 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-slate-900 flex items-center justify-center text-white font-bold text-sm">AV</div>
        <span class="font-bold text-slate-900">ApexVanguard</span>
      </a>
      <a href="index.html" class="text-sm text-slate-600 hover:text-slate-900">&larr; Back to website</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900">Sign in</h1>
      <p class="text-sm text-slate-500 mt-1 mb-6">Welcome back. Log in to see your applications.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="login-email" required placeholder="you@company.com" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="block text-sm font-medium text-slate-700">Password</label>
            <a href="#" id="forgot-link" class="text-xs text-emerald-700 hover:underline">Forgot password?</a>
          </div>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
        </div>

        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-lg transition-colors">
          Sign in
        </button>
      </form>

      <div class="flex items-center gap-3 my-5 text-xs text-slate-400">
        <div class="flex-1 h-px bg-slate-200"></div>
        or
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <button type="button" id="quick-login" class="w-full py-3 bg-white hover:bg-slate-50 text-slate-800 font-semibold text-sm rounded-lg border border-slate-300 transition-colors">
        Quick login (demo account)
      </button>

      <p class="text-sm text-slate-500 text-center mt-6">
        New here? <a href="calculator.html" class="text-emerald-700 font-semibold hover:underline">Apply for financing</a>
      </p>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Password reset link sent to your email.', 'success');
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Signed in. Loading your dashboard...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
    });

    document.getElementById('quick-login').addEventListener('click', () => {
      DataStore.setUser(DEFAULT_USER);
      showToast(`Logged in as ${DEFAULT_USER.name}`, 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
    });
  </script>
</body>
</html>
